name: meadowbots-flat
game: meadowbots
style_prompt: "cute rounded low-detail 3D toy, soft pastel colors, simple shapes, friendly, clean silhouette, no text, plain background"
negative_prompt: "realistic, photo, gritty, sharp edges, text, watermark, busy background"
image:
  count: 4
  size: 1024
  steps: 4            # schnell
  views: front        # front | multi  (Phase 2 bake-off decides the default; see docs/phase-2.md)
  sprite_prompt: "2D game sprite, single subject, centered, isolated on a plain white background, no shadow"
  texture_style: "soft pastel colors, simple rounded shapes, low-detail toy-like material, only the surface material, no characters, no animals, no objects"
  texture_prompt: "seamless tileable texture, top-down, flat even lighting, no shadows, no border, repeating pattern"
mesh:
  target_tris: 12000  # decimate target; hard max 20000
  max_tris: 20000
  max_texture: 2048
  material: flat-albedo   # or: pbr | vertex
  normalize: true
  target_height_m: 0.6    # override per job
  forward_yaw_deg: 180    # TRELLIS.2 output faces +Z (glTF convention); normalize turns it to face -Z (req §8)
  compression: meshopt    # or: draco
  resolution: 1024        # TRELLIS.2 upsample stage target resolution
video:
  model: wan2.2-14b       # Wan 2.2 T2V/I2V A14B fp8 (ComfyUI core); see docs/phase-6.md for alternatives
  fps: 16                 # Wan 2.2 14B is a 16 fps model; 5 s = 81 frames
  duration_s: 5
  width_16x9: 832         # 480p; 1280x720 also works (about 3x slower)
  height_16x9: 480
  width_9x16: 480
  height_9x16: 832
  fast: true              # lightx2v 4-step LoRAs (cfg 1); false = 20 steps, cfg 3.5
  style_prompt: "cute rounded 3D toy look, soft pastel colors, simple shapes, clean, bright even lighting, smooth gentle motion"
# Phase 8: visual styles for photo-driven jobs (promo, model). `restyle` is the Qwen-Image-Edit instruction (empty = no restyle),
# `video` / `three_d` are prompt suffixes for the clip / the 3D reference, `music` / `sfx` hint the audio prompts.
styles:
  realistic:
    restyle: ""
    video: "photorealistic, natural light, real camera, subtle motion"
    three_d: "photorealistic, accurate proportions"
    music: "gentle acoustic, warm, documentary"
    sfx: "realistic, natural ambience"
  pixar:
    restyle: "Turn this into a 3D animated feature film character: soft subsurface skin, big expressive eyes, rounded shapes, warm cinematic lighting, keep the same person, pose and framing"
    video: "3D animated feature film look, soft lighting, expressive, smooth gentle motion"
    three_d: "3D animated film character, rounded shapes, clean silhouette"
    music: "whimsical orchestral, playful, warm, family film"
    sfx: "cartoonish, soft, playful"
  2d:
    restyle: "Redraw this as a flat 2D cartoon: clean line art, cel shading, simple shapes, bright flat colors, keep the same person, pose and framing"
    video: "flat 2D cartoon animation, cel shaded, clean lines, simple motion"
    three_d: "flat-shaded cartoon character, simple shapes"
    music: "bright chiptune-pop, playful, upbeat"
    sfx: "cartoon, bouncy, playful"
  toy:
    restyle: "Turn this into a cute rounded low-detail 3D toy figure, soft pastel colors, simple shapes, friendly, plain background, keep the same pose and framing"
    video: "cute rounded 3D toy look, soft pastel colors, simple shapes, clean, bright even lighting, smooth gentle motion"
    three_d: "cute rounded low-detail 3D toy, soft pastel colors, simple shapes, friendly, clean silhouette"
    music: "cheerful children's game soundtrack, ukulele, glockenspiel, playful"
    sfx: "cute toy-like, soft, clean"
audio:
  sample_rate: 44100
  sfx_channels: mono        # runtime SFX are mono OGG; music and foley stay stereo
  sfx_duration_s: 4
  sfx_style: "cute toy-like, soft, clean, no music, no voice"
  music_duration_s: 30
  music_style: "cheerful children's game soundtrack, ukulele, glockenspiel, soft synth pads, light percussion, playful, warm, simple melody"
  music_bpm: 110
  music_key: "C major"
  voice: af_heart           # Kokoro voice id (models/kokoro/voices)
  voice_speed: 1.0
  music_db: -14             # music level under narration in trailers
rig:
  default: false          # jobs opt in with --rig (creatures only; props/plants get named pivots)
  template: articulationxl # UniRig skeleton template: articulationxl (any creature) | mixamo (humanoid)
formats: [glb, fbx]
