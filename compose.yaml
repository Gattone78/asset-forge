# Asset Forge — nerdctl compose (rootful: `sudo nerdctl compose ...`).
# comfyui is on-demand: never `restart: always`, never started at boot (req §9).
# svc-post runs per job and exits: `sudo nerdctl compose run --rm svc-post --in ... --out-dir ...`.
name: forge

services:
  comfyui:
    build:
      context: ./comfyui
      dockerfile: Dockerfile
    image: forge/comfyui:0.1.1
    restart: "no"
    ports:
      - "8188:8188"
    environment:
      - HF_HOME=/opt/ComfyUI/models/hf
      - HF_TOKEN=${HF_TOKEN:-}
      - COMFY_ENV_ROOT=/opt/ComfyUI/ce
    volumes:
      - ${FORGE_DATA:-/srv/forge}/models:/opt/ComfyUI/models
      - ${FORGE_DATA:-/srv/forge}/comfy/output:/opt/ComfyUI/output
      - ${FORGE_DATA:-/srv/forge}/comfy/input:/opt/ComfyUI/input
      - ${FORGE_DATA:-/srv/forge}/comfy/temp:/opt/ComfyUI/temp
      - ${FORGE_DATA:-/srv/forge}/comfy/user:/opt/ComfyUI/user
      - ${FORGE_DATA:-/srv/forge}/comfy/ce:/opt/ComfyUI/ce
    shm_size: 8g
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]

  svc-post:
    build:
      context: ./svc-post
      dockerfile: Dockerfile
    image: forge/svc-post:0.1.0
    restart: "no"
    profiles: ["tools"]
    user: "1000:1000"
    volumes:
      - ${FORGE_DATA:-/srv/forge}:/srv/forge
    working_dir: /srv/forge

  # svc-audio (Phase 7): CPU-only narration (Kokoro-82M) + ffmpeg, run per job like svc-post; never touches the GPU.
  svc-audio:
    build:
      context: ./svc-audio
      dockerfile: Dockerfile
    image: forge/svc-audio:0.1.0
    restart: "no"
    profiles: ["tools"]
    user: "1000:1000"
    volumes:
      - ${FORGE_DATA:-/srv/forge}:/srv/forge
    working_dir: /srv/forge
